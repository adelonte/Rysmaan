features:
  headline: What you get
  title: "Tenders that answer their own questions."
  description: An RFQ is mostly chasing — who got it, who opened it, who is going to bid, and who is quietly about to miss the date.
  items:
    - icon: i-lucide-send
      title: Invite qualified vendors
      description: Invite from your own list or the network. Vendors whose insurance or licences have lapsed do not make it onto it.
    - icon: i-lucide-circle-help
      title: Clarifications
      description: Questions asked once and answered to every bidder at the same time, so no one bids off a different set of facts.
    - icon: i-lucide-activity
      title: Response tracking
      description: Opened, in progress, declined, submitted. You know where the tender stands without sending a single follow-up email.
    - icon: i-lucide-lock
      title: Sealed close
      description: Bids stay sealed until the deadline passes, then open together with the time each one arrived recorded.
