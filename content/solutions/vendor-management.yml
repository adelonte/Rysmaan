features:
  headline: What you get
  title: "Qualification that stays true."
  description: Most prequalification goes stale the week after it is collected. This one chases its own expiry dates and blocks bids from vendors who have lapsed.
  items:
    - icon: i-lucide-clipboard-check
      title: Prequalification
      description: One questionnaire per trade, scored against your own thresholds, with supporting documents attached to the answers.
    - icon: i-lucide-calendar-clock
      title: Expiry tracking
      description: Insurance and licences carry their own dates. Vendors are chased before they lapse, and lapsed vendors drop out of invite lists.
    - icon: i-lucide-chart-line
      title: Performance history
      description: Delivery, quality and responsiveness scored across projects, so the next award reflects how the last one actually went.
    - icon: i-lucide-network
      title: Vendor network
      description: Search a verified network of suppliers and subcontractors by trade, region, capacity and past performance.
