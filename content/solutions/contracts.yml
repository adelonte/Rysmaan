features:
  headline: What you get
  title: "No re-keying the award."
  description: The contract is built from the bid you accepted, so the scope, rates and terms in it are the ones you actually agreed to.
  items:
    - icon: i-lucide-file-output
      title: Generated from the award
      description: Scope, rates and programme carry across from the winning bid. Nobody retypes a schedule of rates into a Word template.
    - icon: i-lucide-diff
      title: Variations
      description: Every variation priced, approved and stamped against the original, so the contract value is current rather than reconstructed.
    - icon: i-lucide-milestone
      title: Milestones & retention
      description: Payment milestones, retention percentages and release dates tracked against actual progress on the package.
    - icon: i-lucide-history
      title: Audit trail
      description: Who changed what, when, and on whose approval — sealed at the point of award and kept for the life of the contract.
