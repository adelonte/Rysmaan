features:
  headline: What you get
  title: "The cheapest bid is rarely the lowest price."
  description: Most of the risk in a tender hides in what a vendor left out. Normalising the scope is what makes the difference visible before you award.
  items:
    - icon: i-lucide-align-left
      title: Normalised scope
      description: Every bid mapped onto the same line items, so a missing allowance shows up as a gap rather than as a better price.
    - icon: i-lucide-table-2
      title: Line-by-line comparison
      description: Rates, quantities and totals side by side, with outliers against the package budget flagged as you read.
    - icon: i-lucide-triangle-alert
      title: Exclusions surfaced
      description: Qualifications, exclusions and assumptions pulled out of the covering letter and put next to the number they affect.
    - icon: i-lucide-award
      title: Award recommendation
      description: The comparison, the reasoning and the approvals travel together — which is exactly what an auditor asks for later.
