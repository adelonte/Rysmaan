features:
  headline: What you get
  title: "One structure, start to finish."
  description: The package breakdown you set up on day one is the same structure that tenders, contracts, deliveries and handover documents hang off.
  items:
    - icon: i-lucide-layers
      title: Package breakdown
      description: Split the works into packages once. Every RFQ, award, contract and delivery afterwards is tied back to that structure.
    - icon: i-lucide-messages-square
      title: Submittals & RFIs
      description: Route technical queries to the party who can answer them, with a due date attached, so nothing stalls in somebody's inbox.
    - icon: i-lucide-check-check
      title: Threshold approvals
      description: Approval steps that follow value. A variation over your limit routes upward on its own instead of waiting to be noticed.
    - icon: i-lucide-archive
      title: Handover pack
      description: O&M manuals, warranties and as-builts collected as the work completes, rather than chased from twelve vendors at the end.
