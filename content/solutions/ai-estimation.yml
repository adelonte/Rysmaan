features:
  headline: What you get
  title: "A first pass, not a black box."
  description: An estimate you cannot explain is worthless in a tender review. Every line here points back at the drawing it was measured from and the award it was priced against.
  items:
    - icon: i-lucide-ruler
      title: Takeoff assist
      description: Quantities drafted from the drawing set, presented for you to correct rather than dropped into the total unchecked.
    - icon: i-lucide-database
      title: Priced from your history
      description: Rates drawn from what you actually awarded on comparable packages, not from a generic national price book.
    - icon: i-lucide-search-check
      title: Traceable numbers
      description: Every line shows the drawing it came from and the past award that priced it. Nothing in the total is unattributable.
    - icon: i-lucide-trending-up
      title: Estimate against award
      description: When the tender closes, the estimate is compared with the bids — and the gap feeds back into the next one.
cta:
  title: "Try it on a package\nyou have already priced."
  description: The fastest way to judge an estimator is to point it at a job where you know the answer.
