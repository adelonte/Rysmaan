seo:
  title: Rysmaan — The construction platform for procurement, vendors and delivery
  description: Rysmaan brings tendering, vendor qualification, contracts and delivery tracking into one platform, so owners, engineering firms, contractors and suppliers work from the same record.
title: "Run the project.\nNot the paperwork."
description: Rysmaan is the construction platform where packages get tendered, vendors get qualified, contracts get awarded and deliveries get tracked — in one place, on one record.
