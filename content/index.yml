services:
  headline: Platform
  title: "Everything a package touches."
  description: Procurement, qualification, contracts and delivery stop living in inboxes and spreadsheets, and start living on one record every party can see.
  items:
    - icon: i-lucide-file-search
      title: Tendering & RFQs
      description: Issue packages to prequalified vendors, compare bids on a normalised scope, and award with a full audit trail behind every decision.
    - icon: i-lucide-badge-check
      title: Vendor Qualification
      description: Licences, insurance, safety records and financials collected once, verified, and kept current — with expiry chased automatically.
    - icon: i-lucide-file-signature
      title: Contracts & Variations
      description: Contracts generated straight from the awarded bid. Variations, milestones, retention and payment terms tracked on one ledger.
    - icon: i-lucide-kanban
      title: Project Delivery
      description: Scopes, submittals, RFIs and approvals tracked from kickoff to handover, with every action attributed and time-stamped.
    - icon: i-lucide-calendar-range
      title: Schedule & Lead Times
      description: Vendor lead times tied to the programme, so a slipped delivery surfaces weeks before it reaches the critical path.
    - icon: i-lucide-network
      title: Vendor Network
      description: Search a verified network of suppliers and subcontractors by trade, region, capacity and past performance — then invite them in one click.
metrics:
  headline: Why teams switch
  title: "Less chasing. Faster awards."
  description: Procurement is where projects quietly lose weeks. Rysmaan removes the chasing, the re-keying and the version control, and gives the time back to delivery.
  items:
    - value: "60%"
      label: Faster to award
      class: "text-primary"
    - value: "3,400+"
      label: Verified vendors
      class: "text-secondary"
    - value: "1 record"
      label: Per package
      class: "text-info"
    - value: "100%"
      label: Audit ready
      class: "text-success"
