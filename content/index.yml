services:
  headline: Solutions
  title: "Everything a package touches."
  description: Procurement, qualification, contracts and delivery stop living in inboxes and spreadsheets, and start living on one record every party can see.
  items:
    - icon: i-lucide-kanban
      title: Project Management
      description: Break the works into packages once, then run every tender, contract and delivery against that same structure.
      to: /solutions/project-management
    - icon: i-lucide-badge-check
      title: Vendor Management
      description: Licences, insurance, safety records and financials collected once, verified, and chased before they expire.
      to: /solutions/vendor-management
    - icon: i-lucide-file-signature
      title: Contracts
      description: Contracts generated from the awarded bid, with variations, milestones and retention tracked on one ledger.
      to: /solutions/contracts
    - icon: i-lucide-scale
      title: Quote Comparison
      description: Bids normalised to a common scope and compared line by line, with exclusions surfaced rather than buried.
      to: /solutions/quote-comparison
    - icon: i-lucide-file-search
      title: RFQ
      description: Issue packages to prequalified vendors and see who has opened, queried and responded — without chasing.
      to: /solutions/rfq
    - icon: i-lucide-sparkles
      title: AI Estimation
      description: Draft estimates from drawings and your own award history, with every number traceable to where it came from.
      to: /solutions/ai-estimation
metrics:
  headline: Why teams switch
  title: "Less chasing. Faster awards."
  description: Procurement is where projects quietly lose weeks. Rysmaan removes the chasing, the re-keying and the version control, and gives the time back to delivery.
  items:
    - value: "60%"
      label: Faster to award
      class: "text-primary"
    - value: "3,400+"
      label: Verified vendors
      class: "text-secondary"
    - value: "1 record"
      label: Per package
      class: "text-highlighted"
    - value: "100%"
      label: Audit ready
      class: "text-success"
cta:
  title: "Start with one\npackage."
  description: Bring your own vendors or use ours. No rollout programme, no data migration — just your next tender, run properly.
  contact: hello@rysmaan.com
  links:
    - label: Book a demo
      color: primary
      to: 'mailto:hello@rysmaan.com'
